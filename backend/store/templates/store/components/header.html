{% load static %}

<!--
Nombre: header.html
Descripcion: Componente superior que contiene navegación, controles de usuario, carrito, cambio de tema y sección principal de bienvenida.
-->

<header id="inicio" class="header">
    <div class="menu container">
        <a href="#inicio" class="logo" aria-label="Ir al inicio">
            <span class="logo-mark">VS</span>
            <span>Vape Shop</span>
        </a>

        <input type="checkbox" id="menu" />

        <label for="menu" class="menu-label">
            <span class="hamburger"></span>
        </label>

        <nav class="navbar">
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#productos">Productos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>

        <div class="header-controls">
            <button id="open-auth" class="btn small">
                Iniciar sesión
            </button>

            <div id="account-menu" class="account-menu" style="display: none;">
                <button
                    id="account-trigger"
                    class="btn small account-trigger"
                    aria-haspopup="true"
                    aria-expanded="false"
                >
                    <svg class="icon" aria-hidden="true"><use href="#icon-user" /></svg>
                    <span>Mi cuenta</span>
                    <svg class="icon account-caret" aria-hidden="true"><use href="#icon-caret" /></svg>
                </button>

                <div id="account-dropdown" class="account-dropdown" role="menu">
                    <button id="my-orders-btn" class="account-item" role="menuitem">
                        <svg class="icon" aria-hidden="true"><use href="#icon-box" /></svg>
                        Mis pedidos
                    </button>

                    <button id="profile-btn" class="account-item" role="menuitem">
                        <svg class="icon" aria-hidden="true"><use href="#icon-user" /></svg>
                        Mi perfil
                    </button>

                    <button id="favorites-btn" class="account-item" role="menuitem">
                        <svg class="icon" aria-hidden="true"><use href="#icon-shield" /></svg>
                        Favoritos
                    </button>

                    <button id="logout-btn" class="account-item account-item-danger" role="menuitem">
                        Cerrar sesión
                    </button>
                </div>
            </div>

            <div class="header-tools">
                <button id="cart-toggle" class="cart-btn" aria-label="Abrir carrito">
                    <svg class="icon" aria-hidden="true"><use href="#icon-cart" /></svg>
                    <span id="cart-count" class="cart-count">0</span>
                </button>

                <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
                    <span class="theme-icon" aria-hidden="true">☀</span>
                </button>
            </div>
        </div>
    </div>

    <div class="header-content container hero">
        <div class="hero-text">
            <h1>Vapea tu <span>estilo</span>, vive tu experiencia</h1>

            <p>
                Los mejores vapes y sabores, con tecnología de última generación.
                Compra fácil, rápido y seguro.
            </p>

            <div class="hero-actions">
                <a href="#productos" class="btn">Ver productos</a>
                <a href="#informacion" class="btn btn-outline">Conocer más</a>
            </div>

            <div class="hero-badges">
                <span class="badge">
                    <svg class="icon" aria-hidden="true"><use href="#icon-truck" /></svg>
                    Envíos rápidos
                </span>

                <span class="badge">
                    <svg class="icon" aria-hidden="true"><use href="#icon-shield" /></svg>
                    Compra segura
                </span>

                <span class="badge">
                    <svg class="icon" aria-hidden="true"><use href="#icon-whatsapp" /></svg>
                    Soporte WhatsApp
                </span>
            </div>
        </div>

        <div class="hero-media">
            <img
                src="{% static 'store/img/STLTH.webp' %}"
                alt="Vape Shop productos"
                loading="lazy"
            />
        </div>
    </div>
</header>
