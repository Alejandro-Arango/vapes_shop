<!--
Nombre: product_detail_modal.html
Descripcion: Componente modal que muestra informacion ampliada de un producto seleccionado.
-->

<div id="product-detail-modal" class="modal" aria-hidden="true">
    <div class="modal-content product-detail-content">
        <button id="product-detail-close" class="modal-close" aria-label="Cerrar detalle de producto">
            &times;
        </button>

        <div id="product-detail-body" class="product-detail-body">
            <p class="muted">Cargando producto...</p>
        </div>
    </div>
</div>
