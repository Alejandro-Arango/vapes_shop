<!--
Nombre: profile_modal.html
Descripcion: Componente modal para editar datos basicos del perfil del cliente autenticado.
-->

<div id="profile-modal" class="modal" aria-hidden="true">
    <div class="modal-content profile-content">
        <button id="profile-close" class="modal-close" aria-label="Cerrar perfil">
            &times;
        </button>

        <h2>Mi perfil</h2>

        <p id="profile-feedback" class="auth-feedback" style="display: none;"></p>

        <form id="profile-form" class="auth-form profile-form">
            <input
                id="profile-first-name"
                type="text"
                placeholder="Nombre"
                autocomplete="given-name"
            />

            <input
                id="profile-last-name"
                type="text"
                placeholder="Apellido"
                autocomplete="family-name"
            />

            <input
                id="profile-phone"
                type="tel"
                placeholder="Telefono"
                autocomplete="tel"
            />

            <button class="btn" type="submit">
                Guardar cambios
            </button>
        </form>
    </div>
</div>
