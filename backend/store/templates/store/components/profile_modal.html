<!--
Nombre: profile_modal.html
Descripcion: Componente modal para editar datos basicos del perfil del cliente autenticado.
-->

<div id="profile-modal" class="modal" aria-hidden="true">
    <div class="modal-content profile-content">
        <button id="profile-close" class="modal-close" aria-label="Cerrar perfil">
            &times;
        </button>

        <h2>Mi perfil</h2>

        <p id="profile-feedback" class="auth-feedback" style="display: none;"></p>

        <form id="profile-form" class="auth-form profile-form">
            <input
                id="profile-first-name"
                type="text"
                placeholder="Nombre"
                autocomplete="given-name"
            />

            <input
                id="profile-last-name"
                type="text"
                placeholder="Apellido"
                autocomplete="family-name"
            />

            <input
                id="profile-phone"
                type="tel"
                placeholder="Telefono"
                autocomplete="tel"
            />

            <button class="btn" type="submit">
                Guardar cambios
            </button>
        </form>

        <div class="profile-password-section">
            <h3>Seguridad</h3>

            <form id="profile-password-form" class="auth-form profile-form">
                <input
                    id="profile-current-password"
                    type="password"
                    placeholder="Contraseña actual"
                    autocomplete="current-password"
                    required
                />

                <input
                    id="profile-new-password"
                    type="password"
                    placeholder="Nueva contraseña"
                    autocomplete="new-password"
                    required
                />

                <input
                    id="profile-new-password-confirm"
                    type="password"
                    placeholder="Confirmar nueva contraseña"
                    autocomplete="new-password"
                    required
                />

                <button class="btn" type="submit">
                    Cambiar contraseña
                </button>
            </form>
        </div>
    </div>
</div>
