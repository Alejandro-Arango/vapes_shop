<!--
Nombre: favorites_modal.html
Descripcion: Componente modal que muestra los productos favoritos del usuario autenticado.
-->

<div id="favorites-modal" class="modal" aria-hidden="true">
    <div class="modal-content favorites-content">
        <button id="favorites-close" class="modal-close" aria-label="Cerrar favoritos">
            &times;
        </button>

        <h2>Mis favoritos</h2>

        <p id="favorites-feedback" class="orders-feedback" style="display: none;"></p>

        <div id="favorites-body" class="favorites-body">
            <p class="muted">Cargando favoritos...</p>
        </div>
    </div>
</div>
