<!--
Nombre: cart_drawer.html
Descripcion: Componente lateral que muestra los productos agregados al carrito, feedback, total y accion de pago.
-->

<aside id="cart-drawer" class="cart-drawer" aria-hidden="true">
    <header>
        <h3>Tu carrito</h3>

        <button id="cart-close" aria-label="Cerrar carrito">
            &times;
        </button>
    </header>

    <div id="cart-items" class="cart-items">
        <!-- Contenido generado dinamicamente desde app.js -->
    </div>

    <div id="cart-feedback" class="cart-feedback" style="display: none;"></div>

    <section class="shipping-form">
    <h4>Datos de envío</h4>

    <p class="muted">
        Completa la información necesaria para procesar tu pedido.
    </p>

    <div class="shipping-grid">
        <div class="shipping-field">
            <label for="shipping-name">Nombre completo</label>

            <input
                id="shipping-name"
                type="text"
                placeholder="Nombre completo"
                autocomplete="name"
            />
        </div>

        <div class="shipping-field">
            <label for="shipping-phone">Teléfono</label>

            <input
                id="shipping-phone"
                type="tel"
                placeholder="Número de contacto"
                autocomplete="tel"
            />
        </div>

        <div class="shipping-field">
            <label for="shipping-address">Dirección</label>

            <input
                id="shipping-address"
                type="text"
                placeholder="Dirección de entrega"
                autocomplete="street-address"
            />
        </div>

        <div class="shipping-field">
            <label for="shipping-city">Ciudad</label>

            <input
                id="shipping-city"
                type="text"
                placeholder="Ciudad"
                autocomplete="address-level2"
            />
        </div>

        <div class="shipping-field shipping-field-full">
            <label for="shipping-notes">Notas del pedido</label>

            <textarea
                id="shipping-notes"
                placeholder="Indicaciones adicionales"
                rows="3"
            ></textarea>
        </div>
    </div>
</section>

    <footer class="cart-footer">
        <div class="cart-total">
            Total: <strong id="cart-total">$0.00</strong>
        </div>

        <div class="cart-actions">
    <button id="continue-shopping-btn" class="btn btn-outline" type="button">
        Seguir comprando
    </button>

    <button id="clear-cart-btn" class="btn btn-outline" type="button">
        Vaciar carrito
    </button>

    <button id="checkout-btn" class="btn" type="button">
        Pagar
    </button>
    </div>
    </footer>
</aside>
