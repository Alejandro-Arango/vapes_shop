x-production-environment: &production-environment
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Define dominios productivos}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Define origenes HTTPS productivos}
  DJANGO_ADMIN_ALLOWED_IPS: ${DJANGO_ADMIN_ALLOWED_IPS:?Define la allowlist administrativa}
  DJANGO_SESSION_COOKIE_SECURE: "True"
  DJANGO_CSRF_COOKIE_SECURE: "True"
  DJANGO_SECURE_SSL_REDIRECT: "True"
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
  DJANGO_SECURE_HSTS_PRELOAD: "True"
  DJANGO_USE_X_FORWARDED_PROTO: "True"
  DJANGO_TRUST_X_FORWARDED_FOR: "True"
  DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:?Define un backend SMTP productivo}
  DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:?Define el host SMTP}
  DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
  DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:?Define el usuario SMTP}
  DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:?Define la clave SMTP}
  DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-True}
  DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Define el remitente productivo}
  CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:?Define el correo de contacto}
  ORDER_NOTIFICATION_EMAIL: ${ORDER_NOTIFICATION_EMAIL:?Define el correo de pedidos}
  INVENTORY_NOTIFICATION_EMAIL: ${INVENTORY_NOTIFICATION_EMAIL:?Define el correo de inventario}

services:
  migrate:
    image: ${APP_IMAGE:?Define APP_IMAGE con una referencia por digest}
    environment: *production-environment

  web:
    image: ${APP_IMAGE:?Define APP_IMAGE con una referencia por digest}
    environment: *production-environment
    # El healthcheck de la imagen consulta 127.0.0.1 con ese mismo Host, que en
    # produccion no puede figurar en ALLOWED_HOSTS. Se sobrescribe para enviar el
    # primer dominio productivo como cabecera Host y asi pasar la verificacion.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from urllib.request import Request, urlopen; host=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip(); response=urlopen(Request('http://127.0.0.1:8000/api/health/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=3); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  backup:
    image: ${BACKUP_IMAGE:?Define BACKUP_IMAGE con una referencia por digest}

  backup-monitor:
    image: ${APP_IMAGE:?Define APP_IMAGE con una referencia por digest}

  external-backup:
    image: ${BACKUP_IMAGE:?Define BACKUP_IMAGE con una referencia por digest}

  external-recovery:
    image: ${BACKUP_IMAGE:?Define BACKUP_IMAGE con una referencia por digest}

  restore:
    image: ${BACKUP_IMAGE:?Define BACKUP_IMAGE con una referencia por digest}
