# Configuracion de grype para el escaneo de imagenes en CI.
#
# Las siguientes exclusiones estan acotadas al binario de restic, un ejecutable
# de terceros que se descarga fijado por version y hash en docker/backup.Dockerfile.
# restic enlaza estaticamente la biblioteca estandar de Go, por lo que los CVE de
# esa stdlib solo se remedian cuando el proyecto restic publica un release
# compilado con un Go mas nuevo; no son parcheables desde este repositorio.
# El resto de paquetes (sistema operativo y Python) si se mantienen al dia y no
# se excluyen aqui.
ignore:
  - package:
      name: stdlib
      type: go-module
      location: "/usr/local/bin/restic"
  # wheel y jaraco-context provienen del utillaje de construccion incluido en
  # los site-packages del sistema de la imagen base de Python; no forman parte
  # del entorno virtual de la aplicacion (/opt/venv), cuyo wheel ya esta fijado
  # a una version corregida en requirements.txt, y no son alcanzables por el
  # servicio en ejecucion. Se excluyen por CVE concreto para que cualquier
  # vulnerabilidad futura vuelva a aparecer y se revise.
  - vulnerability: GHSA-8rrh-rw8j-w5fx
  - vulnerability: GHSA-58pv-8j8x-9vj2
