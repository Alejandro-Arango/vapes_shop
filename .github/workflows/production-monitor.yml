name: Monitor de produccion

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-monitor
  cancel-in-progress: false

jobs:
  readiness:
    name: Verificar disponibilidad externa
    if: ${{ vars.PRODUCTION_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Consultar readiness y alertar
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          MONITOR_WEBHOOK_URL: ${{ secrets.MONITOR_WEBHOOK_URL }}
          MONITOR_WEBHOOK_TOKEN: ${{ secrets.MONITOR_WEBHOOK_TOKEN }}
        run: |
          mkdir -p monitor-results
          python scripts/monitor_production.py \
            --attempts 3 \
            --retry-delay 10 \
            --timeout 10 \
            --output monitor-results/production-monitor.json

      - name: Subir evidencia del monitoreo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-monitor-report
          path: monitor-results/
          if-no-files-found: warn
          retention-days: 30
