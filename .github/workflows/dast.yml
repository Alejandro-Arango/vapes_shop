name: DAST pasivo

on:
  push:
  pull_request:
  schedule:
    - cron: "29 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Construir imagen
        run: docker build --tag vapes-shop:dast .

      - name: Preparar base efimera
        env:
          DJANGO_SECRET_KEY: "dast-only-secret-with-more-than-fifty-characters-1234567890"
        run: |
          docker volume create vapes-shop-dast-data
          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-dast-data:/data \
            --entrypoint sh \
            vapes-shop:dast \
            -c "chown 10001:10001 /data"

          common_args=(
            --volume vapes-shop-dast-data:/data
            --env DJANGO_DEBUG=False
            --env DJANGO_SECRET_KEY
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
            --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8000
            --env DJANGO_ADMIN_URL_PATH=panel-dast/
            --env DJANGO_DB_ENGINE=sqlite
            --env DJANGO_DB_NAME=/data/dast.sqlite3
            --env DJANGO_CACHE_BACKEND=locmem
            --env DJANGO_SESSION_COOKIE_SECURE=True
            --env DJANGO_CSRF_COOKIE_SECURE=True
            --env DJANGO_SECURE_SSL_REDIRECT=False
            --env DJANGO_SECURE_HSTS_SECONDS=0
            --env DJANGO_LOG_FORMAT=json
          )

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:dast \
            manage.py migrate --noinput

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:dast \
            manage.py shell -c \
            "from store.models import Category, Product; category,_=Category.objects.get_or_create(name='DAST'); Product.objects.get_or_create(name='Producto DAST', defaults={'category': category, 'description': 'Catalogo efimero', 'price': '10.00', 'stock': 5})"

          container_id="$(
            docker run --detach \
              --name vapes-shop-dast \
              --publish 8000:8000 \
              "${common_args[@]}" \
              vapes-shop:dast
          )"

          echo "DAST_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/; then
              exit 0
            fi

            sleep 2
          done

          docker logs "$container_id"
          exit 1

      - name: Ejecutar ZAP Baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:8000/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7c2f8afc893e4e4000be8ad3fd22013fc36e5cce59359349f5a2d45626e2ccb9
          rules_file_name: .zap/rules.tsv
          cmd_options: -j -m 2 -T 6 -i -s
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Conservar logs y limpiar
        if: always()
        run: |
          if [[ -n "${DAST_CONTAINER_ID:-}" ]]; then
            docker logs "$DAST_CONTAINER_ID" > dast-application.log 2>&1 || true
            docker rm --force "$DAST_CONTAINER_ID" || true
          fi

          docker volume rm vapes-shop-dast-data || true

      - name: Subir log de aplicacion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-application-log
          path: dast-application.log
          if-no-files-found: warn
          retention-days: 14
