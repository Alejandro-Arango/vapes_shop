name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-key-only-for-tests"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev pkg-config

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar dependencias instaladas
        run: python -m pip check

      - name: Verificar higiene de secretos
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/check_secret_files.py
          python scripts/check_zap_rules.py

      - name: Probar monitor operativo
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/tests -v

      - name: Revisar configuracion Django
        run: python manage.py check

      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Recolectar archivos estaticos
        run: python manage.py collectstatic --noinput

      - name: Ejecutar pruebas
        run: python manage.py test store

      - name: Validar configuracion tipo produccion
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-value-with-more-than-fifty-characters-1234567890"
          DJANGO_ALLOWED_HOSTS: "example.com,www.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://example.com,https://www.example.com"
          DJANGO_ADMIN_URL_PATH: "panel-seguro/"
          DJANGO_ADMIN_ALLOWED_IPS: "127.0.0.1,192.0.2.10"
          DJANGO_DB_ENGINE: "mysql"
          DJANGO_DB_NAME: "vapes_shop"
          DJANGO_DB_USER: "vapes_user"
          DJANGO_DB_PASSWORD: "ci-db-safe-value"
          DJANGO_DB_HOST: "127.0.0.1"
          DJANGO_DB_PORT: "3306"
          DJANGO_CACHE_BACKEND: "database"
          DJANGO_CACHE_TABLE: "django_cache"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          DJANGO_SECURE_REFERRER_POLICY: "same-origin"
          DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: "same-origin"
          DJANGO_USE_X_FORWARDED_PROTO: "True"
          DJANGO_TRUST_X_FORWARDED_FOR: "True"
          DJANGO_LOG_FORMAT: "json"
          DJANGO_EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
          DJANGO_EMAIL_HOST: "smtp.example.com"
          DJANGO_EMAIL_PORT: "587"
          DJANGO_EMAIL_HOST_USER: "ci-user"
          DJANGO_EMAIL_HOST_PASSWORD: "ci-mail-safe-value"
          DJANGO_EMAIL_USE_TLS: "True"
          DJANGO_EMAIL_USE_SSL: "False"
          DEFAULT_FROM_EMAIL: "Vape Shop <no-reply@example.com>"
          CONTACT_NOTIFICATION_EMAIL: "admin@example.com"
          CONTACT_WHATSAPP_NUMBER: "573016604375"
        run: |
          python manage.py check --deploy
          python manage.py production_check

  container:
    name: Validar imagen y Compose
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar configuracion Compose
        run: |
          docker compose --env-file compose.env.example config --quiet

          APP_IMAGE="ghcr.io/example/vapes-shop@sha256:$(printf '1%.0s' {1..64})" \
          BACKUP_IMAGE="ghcr.io/example/vapes-shop-backup@sha256:$(printf '2%.0s' {1..64})" \
          docker compose \
            --env-file compose.production.env.example \
            --file compose.yaml \
            --file compose.production.yaml \
            config \
            --quiet

      - name: Construir imagen de aplicacion
        run: docker build --tag vapes-shop:test .

      - name: Verificar usuario no privilegiado
        run: |
          test "$(docker image inspect vapes-shop:test --format '{{.Config.User}}')" = "app"

      - name: Validar scripts y proxy
        run: |
          docker run --rm --entrypoint sh vapes-shop:test \
            -n /app/docker/start.sh /app/docker/release.sh
          docker run --rm \
            --user 101:101 \
            --add-host web:127.0.0.1 \
            --volume "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --entrypoint nginx \
            nginx:1.30.3-alpine \
            -t

      - name: Verificar dependencias productivas
        run: |
          docker run --rm --entrypoint gunicorn vapes-shop:test --version

      - name: Probar servidor Gunicorn y health check
        env:
          DJANGO_SECRET_KEY: "container-smoke-secret-with-more-than-fifty-characters-1234567890"
        run: |
          container_id="$(
            docker run --detach \
              --publish 8000:8000 \
              --env DJANGO_DEBUG=False \
              --env DJANGO_SECRET_KEY \
              --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
              --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8000 \
              --env DJANGO_DB_ENGINE=sqlite \
              --env DJANGO_DB_NAME=/tmp/container-smoke.sqlite3 \
              --env DJANGO_CACHE_BACKEND=locmem \
              --env DJANGO_SESSION_COOKIE_SECURE=False \
              --env DJANGO_CSRF_COOKIE_SECURE=False \
              --env DJANGO_SECURE_SSL_REDIRECT=False \
              vapes-shop:test
          )"

          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/live/; then
              exit 0
            fi

            sleep 2
          done

          exit 1

  recovery:
    name: Probar respaldo y restauracion
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DJANGO_SECRET_KEY: "ci-recovery-secret-with-more-than-fifty-characters-1234567890"
      MYSQL_DATABASE: "vapes_shop"
      MYSQL_USER: "vapes_user"
      MYSQL_PASSWORD: "ci-recovery-user-password"
      MYSQL_ROOT_PASSWORD: "ci-recovery-root-password"
      BACKUP_PATH: "./backups-ci"
      BACKUP_RETENTION_DAYS: "14"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen operativa
        run: docker compose --env-file compose.env.example build backup

      - name: Iniciar MySQL
        run: |
          docker compose --env-file compose.env.example up \
            --detach \
            --wait \
            --wait-timeout 120 \
            db

      - name: Crear datos de prueba
        run: |
          printf '%s\n' \
            "CREATE TABLE recovery_probe (id INT PRIMARY KEY, value VARCHAR(32) NOT NULL);" \
            "INSERT INTO recovery_probe (id, value) VALUES (1, 'original');" \
            | docker compose --env-file compose.env.example exec -T db \
                mysql \
                --user="$MYSQL_USER" \
                --password="$MYSQL_PASSWORD" \
                "$MYSQL_DATABASE"

          docker compose --env-file compose.env.example run \
            --rm \
            --no-deps \
            --entrypoint bash \
            restore \
            -c "printf original > /source/media/recovery-probe.txt"

      - name: Crear respaldo verificable
        run: docker compose --env-file compose.env.example run --rm backup

      - name: Alterar datos despues del respaldo
        run: |
          printf '%s\n' \
            "UPDATE recovery_probe SET value = 'mutated' WHERE id = 1;" \
            | docker compose --env-file compose.env.example exec -T db \
                mysql \
                --user="$MYSQL_USER" \
                --password="$MYSQL_PASSWORD" \
                "$MYSQL_DATABASE"

          docker compose --env-file compose.env.example run \
            --rm \
            --no-deps \
            --entrypoint bash \
            restore \
            -c "printf mutated > /source/media/recovery-probe.txt"

      - name: Restaurar respaldo
        run: |
          backup_id="$(cat backups-ci/latest.txt)"

          RESTORE_BACKUP_ID="$backup_id" \
          RESTORE_CONFIRM="RESTORE-$backup_id" \
          docker compose --env-file compose.env.example run --rm restore

      - name: Verificar recuperacion
        run: |
          database_value="$(
            docker compose --env-file compose.env.example exec -T db \
              mysql \
              --batch \
              --skip-column-names \
              --user="$MYSQL_USER" \
              --password="$MYSQL_PASSWORD" \
              --execute="SELECT value FROM recovery_probe WHERE id = 1;" \
              "$MYSQL_DATABASE"
          )"

          media_value="$(
            docker compose --env-file compose.env.example run \
              --rm \
              --no-deps \
              --entrypoint cat \
              restore \
              /source/media/recovery-probe.txt
          )"

          test "$database_value" = "original"
          test "$media_value" = "original"

      - name: Limpiar recursos
        if: always()
        run: |
          docker compose --env-file compose.env.example down --volumes --remove-orphans
          rm -rf backups-ci
