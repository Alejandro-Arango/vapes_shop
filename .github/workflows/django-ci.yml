name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend Django
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-secret-key-only-for-tests"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev pkg-config

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar dependencias instaladas
        run: python -m pip check

      - name: Verificar higiene de secretos
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/check_secret_files.py
          python scripts/check_zap_rules.py
          python scripts/check_capacity_config.py

      - name: Probar monitor operativo
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/tests -v

      - name: Revisar configuracion Django
        run: python manage.py check

      - name: Verificar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run

      - name: Recolectar archivos estaticos
        run: python manage.py collectstatic --noinput

      - name: Ejecutar pruebas
        run: python manage.py test store

      - name: Validar configuracion tipo produccion
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-value-with-more-than-fifty-characters-1234567890"
          DJANGO_ALLOWED_HOSTS: "example.com,www.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://example.com,https://www.example.com"
          DJANGO_ADMIN_URL_PATH: "panel-seguro/"
          DJANGO_ADMIN_ALLOWED_IPS: "127.0.0.1,192.0.2.10"
          DJANGO_DB_ENGINE: "mysql"
          DJANGO_DB_NAME: "vapes_shop"
          DJANGO_DB_USER: "vapes_user"
          DJANGO_DB_PASSWORD: "ci-db-safe-value"
          DJANGO_DB_HOST: "127.0.0.1"
          DJANGO_DB_PORT: "3306"
          DJANGO_CACHE_BACKEND: "database"
          DJANGO_CACHE_TABLE: "django_cache"
          DJANGO_SESSION_COOKIE_SECURE: "True"
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          DJANGO_SECURE_REFERRER_POLICY: "same-origin"
          DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: "same-origin"
          DJANGO_USE_X_FORWARDED_PROTO: "True"
          DJANGO_TRUST_X_FORWARDED_FOR: "True"
          DJANGO_LOG_FORMAT: "json"
          DJANGO_EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
          DJANGO_EMAIL_HOST: "smtp.example.com"
          DJANGO_EMAIL_PORT: "587"
          DJANGO_EMAIL_HOST_USER: "ci-user"
          DJANGO_EMAIL_HOST_PASSWORD: "ci-mail-safe-value"
          DJANGO_EMAIL_USE_TLS: "True"
          DJANGO_EMAIL_USE_SSL: "False"
          DEFAULT_FROM_EMAIL: "Vape Shop <no-reply@example.com>"
          CONTACT_NOTIFICATION_EMAIL: "admin@example.com"
          CONTACT_WHATSAPP_NUMBER: "573016604375"
        run: |
          python manage.py check --deploy
          python manage.py production_check

  container:
    name: Validar imagen y Compose
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar configuracion Compose
        run: |
          docker compose --env-file compose.env.example config --quiet

          APP_IMAGE="ghcr.io/example/vapes-shop@sha256:$(printf '1%.0s' {1..64})" \
          BACKUP_IMAGE="ghcr.io/example/vapes-shop-backup@sha256:$(printf '2%.0s' {1..64})" \
          docker compose \
            --env-file compose.production.env.example \
            --file compose.yaml \
            --file compose.production.yaml \
            config \
            --quiet

      - name: Construir imagen de aplicacion
        run: docker build --tag vapes-shop:test .

      - name: Verificar usuario no privilegiado
        run: |
          test "$(docker image inspect vapes-shop:test --format '{{.Config.User}}')" = "app"

      - name: Validar scripts y proxy
        run: |
          docker run --rm --entrypoint sh vapes-shop:test \
            -n /app/docker/start.sh /app/docker/release.sh
          docker run --rm \
            --user 101:101 \
            --add-host web:127.0.0.1 \
            --volume "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
            --entrypoint nginx \
            nginx:1.30.3-alpine \
            -t

      - name: Verificar dependencias productivas
        run: |
          docker run --rm --entrypoint gunicorn vapes-shop:test --version

      - name: Probar servidor Gunicorn y health check
        env:
          DJANGO_SECRET_KEY: "container-smoke-secret-with-more-than-fifty-characters-1234567890"
        run: |
          container_id="$(
            docker run --detach \
              --publish 8000:8000 \
              --env DJANGO_DEBUG=False \
              --env DJANGO_SECRET_KEY \
              --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
              --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8000 \
              --env DJANGO_DB_ENGINE=sqlite \
              --env DJANGO_DB_NAME=/tmp/container-smoke.sqlite3 \
              --env DJANGO_CACHE_BACKEND=locmem \
              --env DJANGO_SESSION_COOKIE_SECURE=False \
              --env DJANGO_CSRF_COOKIE_SECURE=False \
              --env DJANGO_SECURE_SSL_REDIRECT=False \
              vapes-shop:test
          )"

          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/live/; then
              exit 0
            fi

            sleep 2
          done

          exit 1

  database_outage:
    name: Probar interrupcion temporal de MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      DJANGO_SECRET_KEY: "ci-database-outage-secret-with-more-than-fifty-characters-1234567890"
      MYSQL_DATABASE: "vapes_shop_outage"
      MYSQL_USER: "vapes_user"
      MYSQL_PASSWORD: "ci-outage-user-password"
      MYSQL_ROOT_PASSWORD: "ci-outage-root-password"
      DJANGO_DB_CONN_MAX_AGE: "60"
      DJANGO_DB_CONNECT_TIMEOUT: "3"
      BACKUP_PATH: "./backups-outage-ci"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen de aplicacion
        run: |
          docker compose --env-file compose.env.example build migrate

      - name: Iniciar stack con MySQL
        run: |
          mkdir -p resilience-results

          docker compose --env-file compose.env.example up \
            --detach \
            --wait \
            --wait-timeout 120 \
            db

          docker compose --env-file compose.env.example up \
            --detach \
            migrate
          docker compose --env-file compose.env.example wait migrate

          docker compose --env-file compose.env.example up \
            --detach \
            --wait \
            --wait-timeout 120 \
            web \
            proxy

          python scripts/verify_recovery.py \
            --url http://127.0.0.1:8080/healthz \
            --budget 30 \
            --interval 1 \
            --timeout 5 \
            --consecutive 3 \
            --allow-http \
            --output resilience-results/database-initial-readiness.json

          web_id="$(
            docker compose --env-file compose.env.example ps --quiet web
          )"
          restart_before="$(
            docker inspect --format '{{.RestartCount}}' "$web_id"
          )"

          echo "DATABASE_WEB_ID=$web_id" >> "$GITHUB_ENV"
          echo "DATABASE_WEB_RESTART_BEFORE=$restart_before" >> "$GITHUB_ENV"

      - name: Interrumpir MySQL y verificar degradacion
        run: |
          docker compose --env-file compose.env.example stop \
            --timeout 1 \
            db

          python scripts/verify_dependency_outage.py \
            --liveness-url http://127.0.0.1:8080/livez \
            --readiness-url http://127.0.0.1:8080/healthz \
            --budget 20 \
            --interval 1 \
            --timeout 5 \
            --consecutive 2 \
            --allow-http \
            --output resilience-results/database-outage.json

      - name: Reiniciar MySQL y verificar recuperacion
        run: |
          docker compose --env-file compose.env.example start db

          python scripts/verify_recovery.py \
            --url http://127.0.0.1:8080/healthz \
            --budget 90 \
            --interval 2 \
            --timeout 5 \
            --consecutive 3 \
            --allow-http \
            --output resilience-results/database-recovery.json

          restart_after="$(
            docker inspect \
              --format '{{.RestartCount}}' \
              "$DATABASE_WEB_ID"
          )"

          test "$restart_after" -eq "$DATABASE_WEB_RESTART_BEFORE"

          python -c \
            "import json; from pathlib import Path; Path('resilience-results/database-web-restarts.json').write_text(json.dumps({'restart_before': int('$DATABASE_WEB_RESTART_BEFORE'), 'restart_after': int('$restart_after')}, indent=2) + '\n', encoding='utf-8')"

      - name: Conservar logs de interrupcion
        if: always()
        run: |
          mkdir -p resilience-results
          docker compose --env-file compose.env.example logs --no-color \
            > resilience-results/database-outage-compose.log 2>&1 || true

          if [[ -n "${DATABASE_WEB_ID:-}" ]]; then
            docker stats \
              --no-stream \
              --format '{{json .}}' \
              "$DATABASE_WEB_ID" \
              > resilience-results/database-outage-web-stats.jsonl || true
          fi

      - name: Limpiar stack de interrupcion
        if: always()
        run: |
          docker compose --env-file compose.env.example down \
            --volumes \
            --remove-orphans
          rm -rf backups-outage-ci

      - name: Subir evidencia de interrupcion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-outage
          path: resilience-results/
          if-no-files-found: warn
          retention-days: 30

  media_outage:
    name: Probar interrupcion de escritura multimedia
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen de aplicacion
        run: docker build --tag vapes-shop:media-outage .

      - name: Preparar volumen y procesos persistentes
        env:
          DJANGO_SECRET_KEY: "ci-media-outage-secret-with-more-than-fifty-characters-1234567890"
        run: |
          mkdir -p resilience-results
          chmod 0777 resilience-results
          docker network create vapes-shop-media-outage
          docker volume create vapes-shop-media-outage

          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-media-outage:/media \
            --entrypoint sh \
            vapes-shop:media-outage \
            -c "mkdir -p /media/operational && printf 'persistent-media\n' > /media/operational/persistent.txt && chown -R 10001:10001 /media && chmod 0755 /media /media/operational && chmod 0644 /media/operational/persistent.txt"

          web_id="$(
            docker run --detach \
              --name web \
              --network vapes-shop-media-outage \
              --restart always \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              --memory 256m \
              --cpus 0.25 \
              --pids-limit 128 \
              --volume vapes-shop-media-outage:/app/backend/media \
              --volume "$PWD/scripts:/scripts:ro" \
              --volume "$PWD/resilience-results:/results" \
              --env DJANGO_DEBUG=False \
              --env DJANGO_SECRET_KEY \
              --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,proxy \
              --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8080 \
              --env DJANGO_ADMIN_URL_PATH=panel-media-outage/ \
              --env DJANGO_DB_ENGINE=sqlite \
              --env DJANGO_DB_NAME=/tmp/media-outage.sqlite3 \
              --env DJANGO_CACHE_BACKEND=locmem \
              --env DJANGO_MEDIA_ROOT=/app/backend/media \
              --env DJANGO_SESSION_COOKIE_SECURE=False \
              --env DJANGO_CSRF_COOKIE_SECURE=False \
              --env DJANGO_SECURE_SSL_REDIRECT=False \
              --env DJANGO_SECURE_HSTS_SECONDS=0 \
              vapes-shop:media-outage
          )"

          for attempt in $(seq 1 30); do
            if [[ "$(
              docker inspect --format '{{.State.Health.Status}}' "$web_id"
            )" == "healthy" ]]; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              docker logs "$web_id"
              exit 1
            fi

            sleep 2
          done

          proxy_id="$(
            docker run --detach \
              --name media-proxy \
              --network vapes-shop-media-outage \
              --publish 8080:8080 \
              --user 101:101 \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              --memory 128m \
              --cpus 0.25 \
              --pids-limit 128 \
              --volume "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
              --volume vapes-shop-media-outage:/srv/media:ro \
              --entrypoint nginx \
              nginx:1.30.3-alpine \
              -g "daemon off;"
          )"

          for attempt in $(seq 1 30); do
            if test "$(
              curl --fail --silent \
                http://127.0.0.1:8080/media/operational/persistent.txt
            )" = "persistent-media"; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              docker logs "$proxy_id"
              exit 1
            fi

            sleep 1
          done

          restart_before="$(
            docker inspect --format '{{.RestartCount}}' "$web_id"
          )"

          echo "MEDIA_WEB_ID=$web_id" >> "$GITHUB_ENV"
          echo "MEDIA_PROXY_ID=$proxy_id" >> "$GITHUB_ENV"
          echo "MEDIA_WEB_RESTART_BEFORE=$restart_before" >> "$GITHUB_ENV"

          docker exec \
            --env MEDIA_STORAGE_TEST_ENABLED=true \
            "$web_id" \
            python /scripts/verify_media_storage.py \
              --expect available \
              --output /results/media-initial.json

      - name: Retirar escritura y verificar degradacion
        run: |
          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-media-outage:/media \
            --entrypoint sh \
            vapes-shop:media-outage \
            -c "chmod 0555 /media /media/operational"

          docker exec \
            --env MEDIA_STORAGE_TEST_ENABLED=true \
            "$MEDIA_WEB_ID" \
            python /scripts/verify_media_storage.py \
              --expect unavailable \
              --output /results/media-outage.json

          test "$(
            curl --fail --silent \
              http://127.0.0.1:8080/media/operational/persistent.txt
          )" = "persistent-media"

      - name: Restaurar escritura y verificar recuperacion
        run: |
          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-media-outage:/media \
            --entrypoint sh \
            vapes-shop:media-outage \
            -c "chmod 0755 /media /media/operational"

          docker exec \
            --env MEDIA_STORAGE_TEST_ENABLED=true \
            "$MEDIA_WEB_ID" \
            python /scripts/verify_media_storage.py \
              --expect available \
              --output /results/media-recovery.json

          restart_after="$(
            docker inspect --format '{{.RestartCount}}' "$MEDIA_WEB_ID"
          )"

          test "$restart_after" -eq "$MEDIA_WEB_RESTART_BEFORE"

          python -c \
            "import json; from pathlib import Path; Path('resilience-results/media-web-restarts.json').write_text(json.dumps({'restart_before': int('$MEDIA_WEB_RESTART_BEFORE'), 'restart_after': int('$restart_after')}, indent=2) + '\n', encoding='utf-8')"

      - name: Conservar logs de almacenamiento
        if: always()
        run: |
          mkdir -p resilience-results

          if [[ -n "${MEDIA_WEB_ID:-}" ]]; then
            docker logs "$MEDIA_WEB_ID" \
              > resilience-results/media-outage-web.log 2>&1 || true
          fi

          if [[ -n "${MEDIA_PROXY_ID:-}" ]]; then
            docker logs "$MEDIA_PROXY_ID" \
              > resilience-results/media-outage-proxy.log 2>&1 || true
          fi

      - name: Limpiar almacenamiento efimero
        if: always()
        run: |
          docker rm --force media-proxy web || true
          docker network rm vapes-shop-media-outage || true
          docker volume rm vapes-shop-media-outage || true

      - name: Subir evidencia de almacenamiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-storage-outage
          path: resilience-results/
          if-no-files-found: warn
          retention-days: 30

  recovery:
    name: Probar respaldo y restauracion
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DJANGO_SECRET_KEY: "ci-recovery-secret-with-more-than-fifty-characters-1234567890"
      MYSQL_DATABASE: "vapes_shop"
      MYSQL_USER: "vapes_user"
      MYSQL_PASSWORD: "ci-recovery-user-password"
      MYSQL_ROOT_PASSWORD: "ci-recovery-root-password"
      BACKUP_PATH: "./backups-ci"
      BACKUP_RETENTION_DAYS: "14"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen operativa
        run: docker compose --env-file compose.env.example build backup

      - name: Iniciar MySQL
        run: |
          docker compose --env-file compose.env.example up \
            --detach \
            --wait \
            --wait-timeout 120 \
            db

      - name: Crear datos de prueba
        run: |
          printf '%s\n' \
            "CREATE TABLE recovery_probe (id INT PRIMARY KEY, value VARCHAR(32) NOT NULL);" \
            "INSERT INTO recovery_probe (id, value) VALUES (1, 'original');" \
            | docker compose --env-file compose.env.example exec -T db \
                mysql \
                --user="$MYSQL_USER" \
                --password="$MYSQL_PASSWORD" \
                "$MYSQL_DATABASE"

          docker compose --env-file compose.env.example run \
            --rm \
            --no-deps \
            --entrypoint bash \
            restore \
            -c "printf original > /source/media/recovery-probe.txt"

      - name: Crear respaldo verificable
        run: |
          mkdir -p resilience-results
          docker compose --env-file compose.env.example run --rm backup

          python scripts/monitor_backups.py \
            --root backups-ci \
            --max-age-hours 1 \
            --min-free-bytes 1 \
            --min-free-percent 0 \
            --min-free-copies 0 \
            --output resilience-results/backup-health.json

      - name: Alterar datos despues del respaldo
        run: |
          printf '%s\n' \
            "UPDATE recovery_probe SET value = 'mutated' WHERE id = 1;" \
            | docker compose --env-file compose.env.example exec -T db \
                mysql \
                --user="$MYSQL_USER" \
                --password="$MYSQL_PASSWORD" \
                "$MYSQL_DATABASE"

          docker compose --env-file compose.env.example run \
            --rm \
            --no-deps \
            --entrypoint bash \
            restore \
            -c "printf mutated > /source/media/recovery-probe.txt"

      - name: Restaurar respaldo
        run: |
          backup_id="$(cat backups-ci/latest.txt)"

          RESTORE_BACKUP_ID="$backup_id" \
          RESTORE_CONFIRM="RESTORE-$backup_id" \
          docker compose --env-file compose.env.example run --rm restore

      - name: Verificar recuperacion
        run: |
          database_value="$(
            docker compose --env-file compose.env.example exec -T db \
              mysql \
              --batch \
              --skip-column-names \
              --user="$MYSQL_USER" \
              --password="$MYSQL_PASSWORD" \
              --execute="SELECT value FROM recovery_probe WHERE id = 1;" \
              "$MYSQL_DATABASE"
          )"

          media_value="$(
            docker compose --env-file compose.env.example run \
              --rm \
              --no-deps \
              --entrypoint cat \
              restore \
              /source/media/recovery-probe.txt
          )"

          test "$database_value" = "original"
          test "$media_value" = "original"

      - name: Limpiar recursos
        if: always()
        run: |
          docker compose --env-file compose.env.example down --volumes --remove-orphans
          rm -rf backups-ci

      - name: Subir evidencia de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-recovery
          path: resilience-results/backup-health.json
          if-no-files-found: warn
          retention-days: 30
