name: Publicar imagenes de release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP_IMAGE_NAME: ${{ github.repository }}
  BACKUP_IMAGE_NAME: ${{ github.repository }}-backup

jobs:
  validate:
    name: Validar codigo de la release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "release-validation-secret-only"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar version semantica
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La release debe usar formato vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-security.txt
          python -m pip check

      - name: Validar backend y scripts operativos
        run: |
          python -m pip_audit \
            --requirement requirements-production.txt \
            --no-deps \
            --strict \
            --progress-spinner off
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test store
          cd ..
          python -m unittest discover -s scripts/tests -v

  publish:
    name: Construir, publicar y atestiguar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - validate
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar metadata de aplicacion
        id: app-meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,format=long,prefix=sha-

      - name: Construir y publicar aplicacion
        id: app-push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - name: Atestiguar aplicacion
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
          subject-digest: ${{ steps.app-push.outputs.digest }}
          push-to-registry: true

      - name: Adjuntar SBOM de aplicacion
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}@${{ steps.app-push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: app-sbom.spdx.json
          artifact-name: release-app-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: true

      - name: Preparar metadata de operaciones
        id: backup-meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,format=long,prefix=sha-

      - name: Construir y publicar operaciones
        id: backup-push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./docker/backup.Dockerfile
          push: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}

      - name: Atestiguar operaciones
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}
          subject-digest: ${{ steps.backup-push.outputs.digest }}
          push-to-registry: true

      - name: Adjuntar SBOM de operaciones
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}@${{ steps.backup-push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: backup-sbom.spdx.json
          artifact-name: release-backup-sbom
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: true

      - name: Crear manifiesto de recuperacion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APP_DIGEST: ${{ steps.app-push.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup-push.outputs.digest }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$source_commit" = "$tag_commit"
          python scripts/release_manifest.py create \
            --repository "$repository" \
            --release-tag "$RELEASE_TAG" \
            --source-commit "$source_commit" \
            --app-image \
            "${REGISTRY}/${repository}@${APP_DIGEST}" \
            --backup-image \
            "${REGISTRY}/${repository}-backup@${BACKUP_DIGEST}" \
            --rto-seconds 1800
          python scripts/release_manifest.py verify \
            --expected-repository "$repository" \
            --expected-tag "$RELEASE_TAG"

      - name: Atestiguar manifiesto de recuperacion
        uses: actions/attest@v4
        with:
          subject-path: recovery-manifest.json

      - name: Adjuntar manifiesto a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            recovery-manifest.json \
            recovery-manifest.sha256

      - name: Conservar manifiesto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-manifest
          path: |
            recovery-manifest.json
            recovery-manifest.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Resumen de digests
        run: |
          {
            echo "## Imagenes publicadas"
            echo
            echo "- Aplicacion: \`${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}@${{ steps.app-push.outputs.digest }}\`"
            echo "- Operaciones: \`${{ env.REGISTRY }}/${{ env.BACKUP_IMAGE_NAME }}@${{ steps.backup-push.outputs.digest }}\`"
            echo "- Recuperacion: assets \`recovery-manifest.json\` y \`recovery-manifest.sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
