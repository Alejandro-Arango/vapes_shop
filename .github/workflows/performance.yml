name: Rendimiento y capacidad

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de carga
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - baseline

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Probar catalogo publico
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Seleccionar perfil
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule)
              profile="baseline"
              ;;
            workflow_dispatch)
              profile="${PROFILE_INPUT:-smoke}"
              ;;
            *)
              profile="smoke"
              ;;
          esac

          echo "LOAD_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: Construir imagen
        run: docker build --tag vapes-shop:performance .

      - name: Probar canal concurrente de imagenes
        run: |
          mkdir -p performance-results
          chmod 0777 performance-results

          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --memory 256m \
            --cpus 1.0 \
            --pids-limit 128 \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-results:/results" \
            --env DJANGO_DEBUG=True \
            --env DJANGO_SECRET_KEY=image-pipeline-only-secret \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            --env DJANGO_DB_ENGINE=sqlite \
            --env DJANGO_DB_NAME=/tmp/image-pipeline.sqlite3 \
            --env DJANGO_CACHE_BACKEND=locmem \
            --env DJANGO_PROJECT_ROOT=/app/backend \
            --env IMAGE_PIPELINE_TEST_ENABLED=true \
            --entrypoint python \
            vapes-shop:performance \
            /performance/image_pipeline.py \
            --workers 8 \
            --uploads 100 \
            --output /results/image-pipeline.json

      - name: Preparar aplicacion efimera
        env:
          DJANGO_SECRET_KEY: "performance-only-secret-with-more-than-fifty-characters-1234567890"
        run: |
          docker volume create vapes-shop-performance-data
          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-performance-data:/data \
            --entrypoint sh \
            vapes-shop:performance \
            -c "chown 10001:10001 /data"

          common_args=(
            --volume vapes-shop-performance-data:/data
            --env DJANGO_DEBUG=False
            --env DJANGO_SECRET_KEY
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
            --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8000
            --env DJANGO_ADMIN_URL_PATH=panel-performance/
            --env DJANGO_DB_ENGINE=sqlite
            --env DJANGO_DB_NAME=/data/performance.sqlite3
            --env DJANGO_CACHE_BACKEND=locmem
            --env DJANGO_SESSION_COOKIE_SECURE=False
            --env DJANGO_CSRF_COOKIE_SECURE=False
            --env DJANGO_SECURE_SSL_REDIRECT=False
            --env DJANGO_SECURE_HSTS_SECONDS=0
            --env DJANGO_LOG_FORMAT=json
          )

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:performance \
            manage.py migrate --noinput

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:performance \
            manage.py shell -c \
            "from decimal import Decimal; from store.models import Category, Product; category,_=Category.objects.get_or_create(name='Carga'); Product.objects.bulk_create([Product(name=f'Producto carga {i:03d}', category=category, description='Catalogo efimero para capacidad', price=Decimal('20.00') + i, stock=20) for i in range(1, 121)])"

          container_id="$(
            docker run --detach \
              --name vapes-shop-performance \
              --publish 8000:8000 \
              --memory 512m \
              --cpus 1.0 \
              --pids-limit 256 \
              "${common_args[@]}" \
              vapes-shop:performance
          )"

          echo "PERFORMANCE_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/; then
              exit 0
            fi

            sleep 2
          done

          docker logs "$container_id"
          exit 1

      - name: Ejecutar k6
        run: |
          mkdir -p performance-results
          chmod 0777 performance-results

          docker run --rm \
            --network host \
            --volume "$PWD/performance:/scripts:ro" \
            --volume "$PWD/performance-results:/results" \
            --workdir /results \
            --env BASE_URL=http://127.0.0.1:8000 \
            --env LOAD_PROFILE \
            grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run /scripts/catalog.js

      - name: Conservar metricas y logs
        if: always()
        run: |
          mkdir -p performance-results

          if [[ -n "${PERFORMANCE_CONTAINER_ID:-}" ]]; then
            docker stats \
              --no-stream \
              --format '{{json .}}' \
              "$PERFORMANCE_CONTAINER_ID" \
              > performance-results/container-stats.jsonl || true
            docker logs "$PERFORMANCE_CONTAINER_ID" \
              > performance-results/application.log 2>&1 || true
          fi

      - name: Limpiar recursos
        if: always()
        run: |
          if [[ -n "${PERFORMANCE_CONTAINER_ID:-}" ]]; then
            docker rm --force "$PERFORMANCE_CONTAINER_ID" || true
          fi

          docker volume rm vapes-shop-performance-data || true

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ env.LOAD_PROFILE }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

  resilience:
    name: Probar recuperacion automatica
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Seleccionar presion
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule)
              profile="baseline"
              ;;
            workflow_dispatch)
              profile="${PROFILE_INPUT:-smoke}"
              ;;
            *)
              profile="smoke"
              ;;
          esac

          if [[ "$profile" == "baseline" ]]; then
            rate=500
            duration=30s
            minimum_requests=3000
          else
            rate=300
            duration=15s
            minimum_requests=500
          fi

          echo "LOAD_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "PRESSURE_RATE=$rate" >> "$GITHUB_ENV"
          echo "PRESSURE_DURATION=$duration" >> "$GITHUB_ENV"
          echo "MINIMUM_PRESSURE_REQUESTS=$minimum_requests" >> "$GITHUB_ENV"

      - name: Construir imagen
        run: docker build --tag vapes-shop:resilience .

      - name: Preparar entorno con reinicio automatico
        env:
          DJANGO_SECRET_KEY: "resilience-only-secret-with-more-than-fifty-characters-1234567890"
        run: |
          mkdir -p performance-results
          chmod 0777 performance-results
          docker network create vapes-shop-resilience
          docker volume create vapes-shop-resilience-data
          docker volume create vapes-shop-resilience-media

          docker run --rm \
            --user 0:0 \
            --volume vapes-shop-resilience-data:/data \
            --entrypoint sh \
            vapes-shop:resilience \
            -c "chown 10001:10001 /data"

          common_args=(
            --network vapes-shop-resilience
            --volume vapes-shop-resilience-data:/data
            --volume vapes-shop-resilience-media:/app/backend/media
            --env DJANGO_DEBUG=False
            --env DJANGO_SECRET_KEY
            --env DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,proxy
            --env DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8080
            --env DJANGO_ADMIN_URL_PATH=panel-resilience/
            --env DJANGO_DB_ENGINE=sqlite
            --env DJANGO_DB_NAME=/data/resilience.sqlite3
            --env DJANGO_CACHE_BACKEND=locmem
            --env DJANGO_SESSION_COOKIE_SECURE=False
            --env DJANGO_CSRF_COOKIE_SECURE=False
            --env DJANGO_SECURE_SSL_REDIRECT=False
            --env DJANGO_SECURE_HSTS_SECONDS=0
            --env DJANGO_LOG_FORMAT=json
            --env GUNICORN_WORKERS=1
            --env GUNICORN_THREADS=1
            --env GUNICORN_BACKLOG=32
            --env GUNICORN_TIMEOUT=30
            --env GUNICORN_GRACEFUL_TIMEOUT=10
            --env GUNICORN_MAX_REQUESTS=500
            --env GUNICORN_MAX_REQUESTS_JITTER=50
          )

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:resilience \
            manage.py migrate --noinput

          docker run --rm \
            "${common_args[@]}" \
            --entrypoint python \
            vapes-shop:resilience \
            manage.py shell -c \
            "from decimal import Decimal; from store.models import Category, Product; category,_=Category.objects.get_or_create(name='Resiliencia'); Product.objects.bulk_create([Product(name=f'Producto resiliencia {i:03d}', category=category, description='Carga efimera', price=Decimal('20.00') + i, stock=20) for i in range(1, 121)])"

          web_id="$(
            docker run --detach \
              --name web \
              --restart always \
              --memory 256m \
              --cpus 0.25 \
              --pids-limit 128 \
              "${common_args[@]}" \
              vapes-shop:resilience
          )"

          proxy_id="$(
            docker run --detach \
              --name proxy \
              --network vapes-shop-resilience \
              --publish 8080:8080 \
              --user 101:101 \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              --memory 128m \
              --cpus 0.25 \
              --pids-limit 128 \
              --volume "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
              --volume vapes-shop-resilience-media:/srv/media:ro \
              --entrypoint nginx \
              nginx:1.30.3-alpine \
              -g "daemon off;"
          )"

          echo "RESILIENCE_WEB_ID=$web_id" >> "$GITHUB_ENV"
          echo "RESILIENCE_PROXY_ID=$proxy_id" >> "$GITHUB_ENV"

          python scripts/verify_recovery.py \
            --url http://127.0.0.1:8080/healthz \
            --budget 45 \
            --interval 1 \
            --timeout 3 \
            --consecutive 3 \
            --allow-http \
            --output performance-results/initial-readiness.json

      - name: Saturar y verificar recuperacion
        run: |
          docker run --rm \
            --network host \
            --volume "$PWD/performance:/scripts:ro" \
            --volume "$PWD/performance-results:/results" \
            --workdir /results \
            --env BASE_URL=http://127.0.0.1:8080 \
            --env PRESSURE_RATE \
            --env PRESSURE_DURATION \
            --env MINIMUM_PRESSURE_REQUESTS \
            grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run /scripts/recovery.js

          python scripts/verify_recovery.py \
            --url http://127.0.0.1:8080/healthz \
            --budget 20 \
            --interval 1 \
            --timeout 3 \
            --consecutive 3 \
            --allow-http \
            --output performance-results/post-pressure-recovery.json

      - name: Forzar caida y verificar reinicio
        run: |
          restart_before="$(
            docker inspect \
              --format '{{.RestartCount}}' \
              "$RESILIENCE_WEB_ID"
          )"

          docker exec "$RESILIENCE_WEB_ID" sh -c "kill -KILL 1" || true

          python scripts/verify_recovery.py \
            --url http://127.0.0.1:8080/healthz \
            --budget 30 \
            --interval 1 \
            --timeout 3 \
            --consecutive 3 \
            --allow-http \
            --output performance-results/post-crash-recovery.json

          restart_after="$(
            docker inspect \
              --format '{{.RestartCount}}' \
              "$RESILIENCE_WEB_ID"
          )"

          test "$restart_after" -gt "$restart_before"

          python -c \
            "import json; from pathlib import Path; Path('performance-results/container-restart.json').write_text(json.dumps({'restart_before': int('$restart_before'), 'restart_after': int('$restart_after')}, indent=2) + '\n', encoding='utf-8')"

      - name: Conservar logs y metricas
        if: always()
        run: |
          mkdir -p performance-results

          if [[ -n "${RESILIENCE_WEB_ID:-}" ]]; then
            docker logs "$RESILIENCE_WEB_ID" \
              > performance-results/resilience-web.log 2>&1 || true
            docker stats \
              --no-stream \
              --format '{{json .}}' \
              "$RESILIENCE_WEB_ID" \
              > performance-results/resilience-web-stats.jsonl || true
          fi

          if [[ -n "${RESILIENCE_PROXY_ID:-}" ]]; then
            docker logs "$RESILIENCE_PROXY_ID" \
              > performance-results/resilience-proxy.log 2>&1 || true
          fi

      - name: Limpiar entorno
        if: always()
        run: |
          docker rm --force proxy web || true
          docker network rm vapes-shop-resilience || true
          docker volume rm vapes-shop-resilience-data || true
          docker volume rm vapes-shop-resilience-media || true

      - name: Subir resultados de recuperacion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resilience-${{ env.LOAD_PROFILE }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30

  checkout:
    name: Probar checkout concurrente
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: vapes_shop_performance
          MYSQL_USER: vapes_user
          MYSQL_PASSWORD: performance-user-password
          MYSQL_ROOT_PASSWORD: performance-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root
          --password=performance-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      DJANGO_SECRET_KEY: "checkout-performance-secret-with-more-than-fifty-characters-1234567890"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000"
      DJANGO_ADMIN_URL_PATH: "panel-performance/"
      DJANGO_DB_ENGINE: "mysql"
      DJANGO_DB_NAME: "vapes_shop_performance"
      DJANGO_DB_USER: "vapes_user"
      DJANGO_DB_PASSWORD: "performance-user-password"
      DJANGO_DB_HOST: "127.0.0.1"
      DJANGO_DB_PORT: "3306"
      DJANGO_CACHE_BACKEND: "database"
      DJANGO_CACHE_TABLE: "django_cache"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_EMAIL_BACKEND: "django.core.mail.backends.dummy.EmailBackend"
      DJANGO_LOG_FORMAT: "json"
      CHECKOUT_LOAD_TEST_ENABLED: "true"
      DJANGO_PROJECT_ROOT: "/app/backend"

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Seleccionar tamano de prueba
        env:
          PROFILE_INPUT: ${{ inputs.profile }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            schedule)
              profile="baseline"
              ;;
            workflow_dispatch)
              profile="${PROFILE_INPUT:-smoke}"
              ;;
            *)
              profile="smoke"
              ;;
          esac

          if [[ "$profile" == "baseline" ]]; then
            buyers=20
            stock=10
            coupon_buyers=20
            coupon_max_uses=10
            cancel_requests=20
          else
            buyers=4
            stock=2
            coupon_buyers=4
            coupon_max_uses=2
            cancel_requests=4
          fi

          echo "LOAD_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "CHECKOUT_BUYERS=$buyers" >> "$GITHUB_ENV"
          echo "CHECKOUT_STOCK=$stock" >> "$GITHUB_ENV"
          echo "COUPON_BUYERS=$coupon_buyers" >> "$GITHUB_ENV"
          echo "COUPON_MAX_USES=$coupon_max_uses" >> "$GITHUB_ENV"
          echo "CANCEL_REQUESTS=$cancel_requests" >> "$GITHUB_ENV"

      - name: Construir imagen
        run: docker build --tag vapes-shop:checkout-performance .

      - name: Preparar esquema y sesiones efimeras
        run: |
          mkdir -p performance-runtime performance-results
          chmod 0777 performance-runtime performance-results

          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env DJANGO_SESSION_COOKIE_SECURE
            --env DJANGO_CSRF_COOKIE_SECURE
            --env DJANGO_SECURE_SSL_REDIRECT
            --env DJANGO_SECURE_HSTS_SECONDS
            --env DJANGO_EMAIL_BACKEND
            --env DJANGO_LOG_FORMAT
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --entrypoint /app/docker/release.sh \
            vapes-shop:checkout-performance

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/checkout_fixture.py \
            prepare \
            --buyers "$CHECKOUT_BUYERS" \
            --stock "$CHECKOUT_STOCK" \
            --output /runtime/checkout-fixture.json

      - name: Iniciar aplicacion con MySQL
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env DJANGO_SESSION_COOKIE_SECURE
            --env DJANGO_CSRF_COOKIE_SECURE
            --env DJANGO_SECURE_SSL_REDIRECT
            --env DJANGO_SECURE_HSTS_SECONDS
            --env DJANGO_EMAIL_BACKEND
            --env DJANGO_LOG_FORMAT
          )

          container_id="$(
            docker run --detach \
              --name vapes-shop-checkout-performance \
              --network host \
              --memory 512m \
              --cpus 1.0 \
              --pids-limit 256 \
              "${env_args[@]}" \
              vapes-shop:checkout-performance
          )"

          echo "CHECKOUT_CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/health/; then
              exit 0
            fi

            sleep 2
          done

          docker logs "$container_id"
          exit 1

      - name: Ejecutar contencion e idempotencia
        run: |
          docker run --rm \
            --network host \
            --volume "$PWD/performance:/scripts:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --workdir /results \
            --env BASE_URL=http://127.0.0.1:8000 \
            --env CHECKOUT_FIXTURE_PATH=/runtime/checkout-fixture.json \
            grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run /scripts/checkout.js

      - name: Verificar invariantes en MySQL
        if: ${{ always() && !cancelled() && env.CHECKOUT_CONTAINER_ID != '' }}
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/checkout_fixture.py \
            verify \
            --fixture /runtime/checkout-fixture.json \
            --output /results/checkout-invariants.json

      - name: Preparar limite concurrente de cupon
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/coupon_fixture.py \
            prepare \
            --buyers "$COUPON_BUYERS" \
            --max-uses "$COUPON_MAX_USES" \
            --output /runtime/coupon-fixture.json

      - name: Ejecutar limite concurrente de cupon
        run: |
          docker run --rm \
            --network host \
            --volume "$PWD/performance:/scripts:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --workdir /results \
            --env BASE_URL=http://127.0.0.1:8000 \
            --env COUPON_FIXTURE_PATH=/runtime/coupon-fixture.json \
            grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run /scripts/coupon.js

      - name: Verificar limite de cupon en MySQL
        if: ${{ always() && !cancelled() && env.CHECKOUT_CONTAINER_ID != '' }}
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          if [[ ! -f performance-runtime/coupon-fixture.json ]]; then
            echo "No existe el fixture de cupon; se omite la verificacion."
            exit 0
          fi

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/coupon_fixture.py \
            verify \
            --fixture /runtime/coupon-fixture.json \
            --output /results/coupon-invariants.json

      - name: Preparar cancelacion concurrente
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/cancel_fixture.py \
            prepare \
            --requests "$CANCEL_REQUESTS" \
            --output /runtime/cancel-fixture.json

      - name: Ejecutar cancelacion concurrente
        run: |
          docker run --rm \
            --network host \
            --volume "$PWD/performance:/scripts:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --workdir /results \
            --env BASE_URL=http://127.0.0.1:8000 \
            --env CANCEL_FIXTURE_PATH=/runtime/cancel-fixture.json \
            grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            run /scripts/cancel.js

      - name: Verificar restauracion unica en MySQL
        if: ${{ always() && !cancelled() && env.CHECKOUT_CONTAINER_ID != '' }}
        run: |
          env_args=(
            --env DJANGO_SECRET_KEY
            --env DJANGO_DEBUG
            --env DJANGO_ALLOWED_HOSTS
            --env DJANGO_CSRF_TRUSTED_ORIGINS
            --env DJANGO_ADMIN_URL_PATH
            --env DJANGO_DB_ENGINE
            --env DJANGO_DB_NAME
            --env DJANGO_DB_USER
            --env DJANGO_DB_PASSWORD
            --env DJANGO_DB_HOST
            --env DJANGO_DB_PORT
            --env DJANGO_CACHE_BACKEND
            --env DJANGO_CACHE_TABLE
            --env CHECKOUT_LOAD_TEST_ENABLED
            --env DJANGO_PROJECT_ROOT
          )

          if [[ ! -f performance-runtime/cancel-fixture.json ]]; then
            echo "No existe el fixture de cancelacion; se omite la verificacion."
            exit 0
          fi

          docker run --rm \
            --network host \
            "${env_args[@]}" \
            --volume "$PWD/performance:/performance:ro" \
            --volume "$PWD/performance-runtime:/runtime:ro" \
            --volume "$PWD/performance-results:/results" \
            --entrypoint python \
            vapes-shop:checkout-performance \
            /performance/cancel_fixture.py \
            verify \
            --fixture /runtime/cancel-fixture.json \
            --output /results/cancel-invariants.json

      - name: Conservar metricas y logs
        if: always()
        run: |
          mkdir -p performance-results

          if [[ -n "${CHECKOUT_CONTAINER_ID:-}" ]]; then
            docker stats \
              --no-stream \
              --format '{{json .}}' \
              "$CHECKOUT_CONTAINER_ID" \
              > performance-results/checkout-container-stats.jsonl || true
            docker logs "$CHECKOUT_CONTAINER_ID" \
              > performance-results/checkout-application.log 2>&1 || true
          fi

      - name: Eliminar sesiones efimeras y limpiar
        if: always()
        run: |
          rm -f performance-runtime/checkout-fixture.json
          rm -f performance-runtime/coupon-fixture.json
          rm -f performance-runtime/cancel-fixture.json

          if [[ -n "${CHECKOUT_CONTAINER_ID:-}" ]]; then
            docker rm --force "$CHECKOUT_CONTAINER_ID" || true
          fi

      - name: Subir resultados de checkout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkout-performance-${{ env.LOAD_PROFILE }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30
