worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;
    reset_timedout_connection on;
    send_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    limit_req_zone $binary_remote_addr zone=per_ip_requests:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    upstream vape_shop_backend {
        server web:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        server_tokens off;

        client_max_body_size 6m;
        limit_req_status 429;
        limit_conn_status 429;

        location = /livez {
            access_log off;
            default_type text/plain;
            add_header X-Request-ID $request_id always;
            return 200 "ok\n";
        }

        location = /healthz {
            proxy_pass http://vape_shop_backend/api/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            access_log off;
        }

        location /media/ {
            alias /srv/media/;
            add_header X-Content-Type-Options nosniff always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header X-Request-ID $request_id always;
            expires 1h;
        }

        location / {
            limit_req zone=per_ip_requests burst=100 nodelay;
            limit_conn per_ip_connections 32;
            proxy_pass http://vape_shop_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Request-ID;
            add_header X-Request-ID $request_id always;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 65s;
        }
    }
}
