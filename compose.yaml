name: vapes-shop

x-app-environment: &app-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY in compose.env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,proxy}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_ADMIN_URL_PATH: ${DJANGO_ADMIN_URL_PATH:-panel-seguro/}
  DJANGO_ADMIN_ALLOWED_IPS: ${DJANGO_ADMIN_ALLOWED_IPS:-}
  DJANGO_OTP_TOTP_ISSUER: ${DJANGO_OTP_TOTP_ISSUER:-Vape Shop Admin}
  DJANGO_OTP_TOTP_THROTTLE_FACTOR: ${DJANGO_OTP_TOTP_THROTTLE_FACTOR:-1}
  DJANGO_OTP_STATIC_THROTTLE_FACTOR: ${DJANGO_OTP_STATIC_THROTTLE_FACTOR:-1}
  DJANGO_DB_ENGINE: mysql
  DJANGO_DB_NAME: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in compose.env}
  DJANGO_DB_USER: ${MYSQL_USER:?Define MYSQL_USER in compose.env}
  DJANGO_DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in compose.env}
  DJANGO_DB_HOST: db
  DJANGO_DB_PORT: "3306"
  DJANGO_DB_CONN_MAX_AGE: ${DJANGO_DB_CONN_MAX_AGE:-60}
  DJANGO_DB_CONNECT_TIMEOUT: ${DJANGO_DB_CONNECT_TIMEOUT:-10}
  DJANGO_MEDIA_ROOT: /app/backend/media
  DJANGO_CACHE_BACKEND: database
  DJANGO_CACHE_TABLE: django_cache
  DJANGO_PASSWORD_MIN_LENGTH: ${DJANGO_PASSWORD_MIN_LENGTH:-12}
  DJANGO_SESSION_COOKIE_AGE: ${DJANGO_SESSION_COOKIE_AGE:-604800}
  DJANGO_PASSWORD_RESET_TIMEOUT: ${DJANGO_PASSWORD_RESET_TIMEOUT:-3600}
  DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE: ${DJANGO_DATA_UPLOAD_MAX_MEMORY_SIZE:-1048576}
  DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE: ${DJANGO_FILE_UPLOAD_MAX_MEMORY_SIZE:-1048576}
  DJANGO_DATA_UPLOAD_MAX_NUMBER_FIELDS: ${DJANGO_DATA_UPLOAD_MAX_NUMBER_FIELDS:-1000}
  DJANGO_DATA_UPLOAD_MAX_NUMBER_FILES: ${DJANGO_DATA_UPLOAD_MAX_NUMBER_FILES:-20}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-False}
  DJANGO_SECURE_REFERRER_POLICY: ${DJANGO_SECURE_REFERRER_POLICY:-same-origin}
  DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY: ${DJANGO_SECURE_CROSS_ORIGIN_OPENER_POLICY:-same-origin}
  DJANGO_PERMISSIONS_POLICY: ${DJANGO_PERMISSIONS_POLICY:-camera=(), microphone=(), geolocation=(), payment=(), usb=()}
  DJANGO_USE_X_FORWARDED_PROTO: ${DJANGO_USE_X_FORWARDED_PROTO:-True}
  DJANGO_TRUST_X_FORWARDED_FOR: ${DJANGO_TRUST_X_FORWARDED_FOR:-True}
  AUTH_THROTTLE_RATE: ${AUTH_THROTTLE_RATE:-20/min}
  AUTH_USER_THROTTLE_RATE: ${AUTH_USER_THROTTLE_RATE:-10/min}
  CONTACT_THROTTLE_RATE: ${CONTACT_THROTTLE_RATE:-10/hour}
  CART_THROTTLE_RATE: ${CART_THROTTLE_RATE:-60/min}
  CHECKOUT_THROTTLE_RATE: ${CHECKOUT_THROTTLE_RATE:-20/min}
  DJANGO_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  CONTACT_WHATSAPP_NUMBER: ${CONTACT_WHATSAPP_NUMBER:-573016604375}
  DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
  DJANGO_STORE_LOG_LEVEL: ${DJANGO_STORE_LOG_LEVEL:-WARNING}
  DJANGO_REQUEST_LOG_LEVEL: ${DJANGO_REQUEST_LOG_LEVEL:-ERROR}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_BACKLOG: ${GUNICORN_BACKLOG:-256}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
  GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
  GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-5}
  GUNICORN_LIMIT_REQUEST_LINE: ${GUNICORN_LIMIT_REQUEST_LINE:-4094}
  GUNICORN_LIMIT_REQUEST_FIELDS: ${GUNICORN_LIMIT_REQUEST_FIELDS:-100}
  GUNICORN_LIMIT_REQUEST_FIELD_SIZE: ${GUNICORN_LIMIT_REQUEST_FIELD_SIZE:-8190}
  GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
  GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-backup-environment: &backup-environment
  MYSQL_HOST: db
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in compose.env}
  MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER in compose.env}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in compose.env}
  BACKUP_ROOT: /backups
  MEDIA_SOURCE: /source/media
  MEDIA_UID: "10001"
  MEDIA_GID: "10001"
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}

x-backup-monitor-environment: &backup-monitor-environment
  BACKUP_ROOT: /backups
  BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
  BACKUP_FUTURE_TOLERANCE_MINUTES: ${BACKUP_FUTURE_TOLERANCE_MINUTES:-5}
  BACKUP_MIN_DATABASE_BYTES: ${BACKUP_MIN_DATABASE_BYTES:-128}
  BACKUP_MIN_MEDIA_BYTES: ${BACKUP_MIN_MEDIA_BYTES:-32}
  BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-1073741824}
  BACKUP_MIN_FREE_PERCENT: ${BACKUP_MIN_FREE_PERCENT:-10}
  BACKUP_MIN_FREE_COPIES: ${BACKUP_MIN_FREE_COPIES:-2}
  MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
  MONITOR_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:-}

x-external-backup-environment: &external-backup-environment
  <<: *backup-monitor-environment
  EXTERNAL_BACKUP_ENABLED: ${EXTERNAL_BACKUP_ENABLED:-false}
  EXTERNAL_BACKUP_HOST: ${EXTERNAL_BACKUP_HOST:-vapes-shop}
  EXTERNAL_BACKUP_CHECK_SUBSET: ${EXTERNAL_BACKUP_CHECK_SUBSET:-5%}
  EXTERNAL_BACKUP_KEEP_DAILY: ${EXTERNAL_BACKUP_KEEP_DAILY:-14}
  EXTERNAL_BACKUP_KEEP_WEEKLY: ${EXTERNAL_BACKUP_KEEP_WEEKLY:-8}
  EXTERNAL_BACKUP_KEEP_MONTHLY: ${EXTERNAL_BACKUP_KEEP_MONTHLY:-12}
  EXTERNAL_BACKUP_MIN_PASSWORD_LENGTH: ${EXTERNAL_BACKUP_MIN_PASSWORD_LENGTH:-20}
  EXTERNAL_BACKUP_COMMAND_TIMEOUT: ${EXTERNAL_BACKUP_COMMAND_TIMEOUT:-3600}
  EXTERNAL_BACKUP_RESTORE_ROOT: /restore-check
  RESTIC_REPOSITORY_FILE: /run/secrets/restic_repository
  RESTIC_PASSWORD_FILE: /run/secrets/restic_password
  RESTIC_CACHE_DIR: /tmp/restic-cache

services:
  db:
    image: mysql:8.4.10
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    cpus: ${DB_CPU_LIMIT:-1.00}
    pids_limit: 256
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE in compose.env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER in compose.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in compose.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in compose.env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    stop_grace_period: 30s

  migrate:
    build:
      context: .
    image: vapes-shop-web:local
    command: ["/app/docker/release.sh"]
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATE_CPU_LIMIT:-0.50}
    pids_limit: 128
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  web:
    image: vapes-shop-web:local
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-1.00}
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/backend/media
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    logging: *default-logging
    stop_grace_period: 45s

  proxy:
    image: nginx:1.30.3-alpine
    restart: unless-stopped
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    cpus: ${PROXY_CPU_LIMIT:-0.25}
    user: "101:101"
    entrypoint:
      - nginx
      - -g
      - daemon off;
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/srv/media:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/livez
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging: *default-logging
    stop_grace_period: 30s

  backup:
    profiles:
      - ops
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: vapes-shop-backup:local
    command: ["/usr/local/bin/backup.sh"]
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${BACKUP_CPU_LIMIT:-0.50}
    pids_limit: 128
    environment: *backup-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/source/media:ro
      - ${BACKUP_PATH:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  backup-monitor:
    profiles:
      - ops
    build:
      context: .
    image: vapes-shop-web:local
    command:
      - python
      - /monitor/monitor_backups.py
      - --root
      - /backups
    user: "0:0"
    mem_limit: ${BACKUP_MONITOR_MEMORY_LIMIT:-256m}
    cpus: ${BACKUP_MONITOR_CPU_LIMIT:-0.25}
    pids_limit: 64
    environment: *backup-monitor-environment
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups:ro
      - ./scripts/monitor_backups.py:/monitor/monitor_backups.py:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  external-backup:
    profiles:
      - ops
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: vapes-shop-backup:local
    entrypoint:
      - python3
      - /usr/local/lib/vapes-shop/external_backup.py
    command:
      - backup
    user: "0:0"
    mem_limit: ${EXTERNAL_BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${EXTERNAL_BACKUP_CPU_LIMIT:-0.50}
    pids_limit: 128
    environment: *external-backup-environment
    env_file:
      - path: ${EXTERNAL_BACKUP_ENV_FILE:-./secrets/restic-backend.env}
        required: false
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups:ro
      - ${EXTERNAL_BACKUP_LOCAL_PATH:-./external-backups}:/external-repository
      - ${EXTERNAL_BACKUP_REPOSITORY_FILE:-./secrets/restic-repository.txt}:/run/secrets/restic_repository:ro
      - ${EXTERNAL_BACKUP_PASSWORD_FILE:-./secrets/restic-password.txt}:/run/secrets/restic_password:ro
      - external_restore_check:/restore-check
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  external-recovery:
    profiles:
      - ops
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: vapes-shop-backup:local
    entrypoint:
      - python3
      - /usr/local/lib/vapes-shop/external_backup.py
    command:
      - recover-latest
    user: "0:0"
    mem_limit: ${EXTERNAL_BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${EXTERNAL_BACKUP_CPU_LIMIT:-0.50}
    pids_limit: 128
    environment: *external-backup-environment
    env_file:
      - path: ${EXTERNAL_BACKUP_ENV_FILE:-./secrets/restic-backend.env}
        required: false
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ${EXTERNAL_BACKUP_LOCAL_PATH:-./external-backups}:/external-repository
      - ${EXTERNAL_BACKUP_REPOSITORY_FILE:-./secrets/restic-repository.txt}:/run/secrets/restic_repository:ro
      - ${EXTERNAL_BACKUP_PASSWORD_FILE:-./secrets/restic-password.txt}:/run/secrets/restic_password:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  restore:
    profiles:
      - ops
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    image: vapes-shop-backup:local
    command: ["/usr/local/bin/restore.sh"]
    mem_limit: ${RESTORE_MEMORY_LIMIT:-512m}
    cpus: ${RESTORE_CPU_LIMIT:-0.50}
    pids_limit: 128
    environment:
      <<: *backup-environment
      RESTORE_BACKUP_ID: ${RESTORE_BACKUP_ID:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      RESTORE_CREATE_SAFETY_BACKUP: ${RESTORE_CREATE_SAFETY_BACKUP:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/source/media
      - ${BACKUP_PATH:-./backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    logging: *default-logging

volumes:
  external_restore_check:
  mysql_data:
  media_data:
